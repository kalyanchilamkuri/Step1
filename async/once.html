<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asynchronous JavaScript</title>
</head>
<body>
    <h1>Hello</h1>
    <button id="stop">stop</button>
</body>
<script>
    // run thise code after a specified amount of time 
    setTimeout(function(){
        console.log("kalyan")
    },2000);

    const one=function(){
        console.log(one)
    }
    setTimeout(one,2000);

    const changetext=function(){
        document.querySelector('h1').innerHTML="okok";
    }

    const changeme=setTimeout(changetext,2000);

    document.querySelector('#stop').addEventListener('click',function(){
        clearTimeout(changeme);
        console.log("stopped");
    })

    // clearTimeout() is used to cancel a setTimeout() 


</script>
</html>
